<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Atlas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090703;color:#fff;font:16px Arial,sans-serif}
[hidden]{display:none!important}
header{background:#120d05;border-bottom:1px solid #a87914;padding:14px 10px}
.bar{display:flex;align-items:center;justify-content:center;gap:12px}
h1{margin:0;color:#ffda68;text-shadow:0 0 12px #f8b62d80;font-size:clamp(30px,6vw,46px)}
.language{position:relative;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;color:#fff0ad;background:#765006;border:1px solid #c69426;border-radius:9px;box-shadow:0 0 8px #f8b62d80;font-size:25px}
.language select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.language:focus-within,:focus-visible{outline:2px solid #ffda68;outline-offset:4px}
main{max-width:1050px;margin:auto;padding:20px 12px}
h2{color:#ffda68;text-align:center;margin:0 0 14px;font-size:24px}
.topic-links,.topic-links ul{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.topic-links a{display:flex;align-items:center;min-height:50px;max-width:460px;width:100%;margin:auto;padding:10px 18px;border:1px solid #e2b63e;border-radius:10px;background:#f8e8ad;color:#241805!important;font-size:19px;font-weight:800;text-decoration:none}
.topic-links a:hover{background:#ffd85b}
.topic-links nav{margin:0!important;padding:0!important;direction:ltr}
.topic-links summary{display:none}
#viewer{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#090703}
</style>
</head>
<body>
<div id="catalog">
<header><div class="bar">
<h1 id="catalog-title">Visual Atlas</h1>
<label class="language" title="Language">
<span aria-hidden="true">🌐</span>
<select id="language" aria-label="Atlas language" title="Atlas language">
<option value="en">English</option><option value="he">עברית</option>
<option value="ar">العربية</option><option value="es">Español</option>
<option value="fr">Français</option><option value="de">Deutsch</option>
<option value="ru">Русский</option><option value="it">Italiano</option><option value="pt">Português</option>
</select>
</label>
</div></header>
<main>
<h2 id="topic-heading">Topics</h2>
<div class="topic-links" id="topic-links">
<a href="./topics/horse/index.html" data-topic="horse">Horse</a>
<!-- visual-topics:start -->
<nav aria-label="More topics">
<ul><li><a href="./topics/dog-internal-anatomy/index.html" data-topic="dog-internal-anatomy">Dog</a></li></ul>
</nav>
<!-- visual-topics:end -->
</div>
</main>
</div>
<iframe id="viewer" title="Atlas topic" allowfullscreen hidden></iframe>
<script>
const catalog=document.getElementById("catalog");
const viewer=document.getElementById("viewer");
const selector=document.getElementById("language");
const topics=new Map();
let lastLink;
const labels={
  en:["Visual Atlas","Topics","Horse","Dog","Atlas language"],
  he:["אטלס חזותי","נושאים","סוס","כלב","שפת האטלס"],
  ar:["الأطلس المرئي","الموضوعات","الحصان","الكلب","لغة الأطلس"],
  es:["Atlas visual","Temas","Caballo","Perro","Idioma del atlas"],
  fr:["Atlas visuel","Sujets","Cheval","Chien","Langue de l’atlas"],
  de:["Visueller Atlas","Themen","Pferd","Hund","Sprache des Atlas"],
  ru:["Визуальный атлас","Темы","Лошадь","Собака","Язык атласа"],
  it:["Atlante visivo","Argomenti","Cavallo","Cane","Lingua dell’atlante"],
  pt:["Atlas visual","Temas","Cavalo","Cão","Idioma do atlas"]
};
let topicTranslationRequest;

function translateCatalog(){
  const lang=selector.value;
  const [title,heading,horse,dog,languageLabel]=labels[lang] || labels.en;
  document.documentElement.lang=lang;
  catalog.dir=["he","ar"].includes(lang)?"rtl":"ltr";
  document.title=title;
  document.getElementById("catalog-title").textContent=title;
  document.getElementById("topic-heading").textContent=heading;
  selector.setAttribute("aria-label",languageLabel);
  selector.title=languageLabel;
  selector.parentElement.title=languageLabel;
  topics.get("horse").textContent=horse;
  topics.get("dog-internal-anatomy")?.replaceChildren(dog);
  topicTranslationRequest?.abort();
  const extra=[...topics.entries()].filter(([slug])=>slug!=="horse" && slug!=="dog-internal-anatomy");
  for(const [,link] of extra)link.textContent=lang==="he"?link.dataset.original:link.dataset.english;
  if(!extra.length || lang==="en" || lang==="he")return;
  const request=new AbortController();
  topicTranslationRequest=request;
  const timeout=setTimeout(()=>request.abort(),6500);
  const query=new URLSearchParams({client:"gtx",sl:"en",tl:lang,dt:"t",q:extra.map(([,link])=>link.dataset.english).join("\\n")});
  fetch("https://translate.googleapis.com/translate_a/single?"+query,{signal:request.signal})
    .then(response=>{if(!response.ok)throw Error("Translation unavailable");return response.json();})
    .then(data=>{
      const lines=data[0].map(segment=>segment[0]).join("").trim().split(/\\r?\\n/);
      if(selector.value===lang && lines.length===extra.length && lines.every(line=>line.trim())){
        extra.forEach(([,link],i)=>{link.textContent=lines[i].trim();});
      }
    }).catch(()=>{}).finally(()=>clearTimeout(timeout));
}
try { selector.value=localStorage.getItem("visualLanguage") || "en"; } catch {}
if(!selector.value)selector.value="en";
selector.addEventListener("change",()=>{
  try { localStorage.setItem("visualLanguage",selector.value); } catch {}
  translateCatalog();
});
for(const link of document.querySelectorAll("#topic-links a")){
  const slug=link.getAttribute("href").match(/^\.\/topics\/([a-z0-9-]+)\/(?:index\.html)?$/)?.[1];
  if(!slug)continue;
  topics.set(slug,link);
  link.dataset.original=link.textContent.trim();
  link.dataset.english=slug.replace(/-\d{8}-[a-f0-9]{6}$/,"")
    .split("-").map(word=>word.charAt(0).toUpperCase()+word.slice(1)).join(" ");
  link.addEventListener("click",event=>{
    if(event.ctrlKey || event.metaKey || event.shiftKey || event.altKey)return;
    event.preventDefault();
    requestAtlasFullscreen();
    lastLink=link;
    history.pushState(null,"","#"+slug);
    renderTopic();
  });
}
function requestAtlasFullscreen(){
  if(document.fullscreenElement)return;
  const element=document.documentElement;
  try {
    if(element.requestFullscreen)element.requestFullscreen().catch(()=>{});
    else element.webkitRequestFullscreen?.();
  } catch {}
}
function renderTopic(){
  const link=topics.get(location.hash.slice(1));
  if(!link){
    const wasViewing=!viewer.hidden;
    viewer.hidden=true;
    viewer.removeAttribute("src");
    catalog.hidden=false;
    if(wasViewing)lastLink?.focus();
    return;
  }
  const source=new URL(link.href);
  source.searchParams.set("lang",selector.value);
  if(viewer.src!==source.href)viewer.src=source.href;
  viewer.title=link.textContent.trim();
  catalog.hidden=true;
  viewer.hidden=false;
  window.scrollTo(0,0);
}
window.addEventListener("popstate",renderTopic);
translateCatalog();
renderTopic();
</script>
</body>
</html>
