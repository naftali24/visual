<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משפחת דוידוביץ — נפתלי</title><link rel="stylesheet" href="../../css/topic.css?v=9"><link rel="stylesheet" href="../../css/game.css?v=7"><style>
body{background:#090703}main{max-width:1050px;padding:4px}#stage{padding:4px;background:#100c05;position:relative}.family-picture{width:88%;margin:3px auto;aspect-ratio:1.8;background:linear-gradient(#e4bd67,#9c722e);padding:1.2%;border:2px solid #d4ac4d;border-radius:7px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:1%;position:relative}.slot{background:#fff2c6;border:2px solid #80581c;border-radius:4px;position:relative;min-width:0;min-height:0;overflow:hidden;display:grid;place-items:center;color:#6e542c;font-size:clamp(10px,2vw,22px)}.slot img{width:100%;height:100%;object-fit:cover}.slot .upload{position:absolute;right:2px;top:2px;border:1px solid #a37a2a;background:#ffdc78;color:#322000;border-radius:5px;cursor:pointer;font-size:12px;z-index:4}.slot input{display:none}.slot .marker{position:absolute;bottom:2px;left:2px;font-size:10px;color:#533c16;background:#fff5d2bb;border-radius:3px;padding:1px 3px}.items{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.items button{font-size:clamp(10px,1.3vw,17px);min-height:34px;padding:3px 1px}.items button span{display:block}.items button.active{outline:2px solid #fff2b6}#guides{z-index:2}#guides line{stroke:#ad6637;stroke-width:1.6;opacity:.7}#guides line.active{stroke:#ffef82;stroke-width:3;opacity:1}#detail{margin-top:5px;padding:7px}#detail h2{font-size:18px}#detail p{font-size:16px}#gamePrompt{color:#ffda68;text-align:center;font-size:20px;margin:4px}.atlas-playing .items button span{visibility:hidden}.atlas-playing .items button.revealed span{visibility:visible}.atlas-playing #detail{display:none}.atlas-playing .slot .marker{display:none}.restart{z-index:20}.mode{right:55px;font-size:20px} @media(max-width:650px){.family-picture{width:96%;aspect-ratio:1.22}.items button{font-size:10px;min-height:29px}.slot{border-width:1px}.slot .upload{font-size:10px}}

<main><div id="stage"><div id="gamePrompt" hidden></div><div class="items" id="above"></div><div class="family-picture" id="picture"></div><div class="items" id="below"></div><svg id="guides" aria-hidden="true"></svg></div><section id="detail" hidden><h2 id="term"></h2><p id="description"></p></section></main>
<script>const people=[["יצחק דוידוביץ",[]],["רות דוידוביץ",[]],["נפתלי דוידוביץ",[0,1]],["רחל דוידוביץ",[]],["שרה לרמן",[0,1]],["רוחלה דוידוביץ",[]],["רון דוידוביץ",[2,3]],["תמר דוידוביץ",[2,3]],["יעל דוידוביץ",[2,3]],["שלומית דוידוביץ",[]],["עמרי אולוס",[]],["שחר הורן",[7]],["נמרוד הורן",[7]],["קשת דוידוביץ",[6,9]],["לחן דוידוביץ",[6,9]],["קורן דוידוביץ",[6,9]],["גלי אולוס",[8,10]],["דרור לרמן",[4]],["עדי לרמן",[]],["נטע לרמן",[17,18]],["טל לביא",[4]],["ספי לביא",[]],["עומר לביא",[20,21]],["ליאור לביא",[20,21]]];const picture=document.getElementById('picture'),guides=document.getElementById('guides'),stage=document.getElementById('stage');let selected=-1,game=false,goal=0,found=new Set();const buttons=[],slots=[];
people.forEach(([name],i)=>{const slot=document.createElement('div');slot.className='slot';slot.dataset.i=i;const symbol=document.createElement('span');symbol.textContent='📷';slot.append(symbol);const marker=document.createElement('span');marker.className='marker';marker.textContent=i+1;slot.append(marker);const add=document.createElement('button');add.className='upload';add.textContent='＋';add.title='הוסף תמונה עבור '+name;const inp=document.createElement('input');inp.type='file';inp.accept='image/*';add.onclick=()=>inp.click();inp.onchange=()=>{const file=inp.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,450/Math.max(image.width,image.height));canvas.width=image.width*scale;canvas.height=image.height*scale;canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const src=canvas.toDataURL('image/jpeg',.72);try{localStorage.setItem('visual-family-'+i,src)}catch{}setPhoto(symbol,src)};image.src=reader.result};reader.readAsDataURL(file)};slot.append(add,inp);slot.onclick=e=>{if(e.target===add)return;choose(i)};picture.append(slot);slots.push(slot);const saved=localStorage.getItem('visual-family-'+i);if(saved)setPhoto(symbol,saved);
const button=document.createElement('button');button.type='button';button.dataset.i=i;const span=document.createElement('span');span.textContent=name;button.append(span);button.onclick=()=>choose(i);document.getElementById(i<12?'above':'below').append(button);buttons.push(button)});
function setPhoto(el,src){el.replaceChildren();const img=document.createElement('img');img.src=src;el.append(img)}
function draw(){const bounds=stage.getBoundingClientRect();if(!bounds.width)return;guides.setAttribute('viewBox','0 0 '+bounds.width+' '+bounds.height);guides.replaceChildren();buttons.forEach((button,i)=>{const a=button.getBoundingClientRect(),b=slots[i].getBoundingClientRect(),line=document.createElementNS('http://www.w3.org/2000/svg','line');const top=i<12;line.setAttribute('x1',a.left+a.width/2-bounds.left);line.setAttribute('y1',(top?a.bottom:a.top)-bounds.top);line.setAttribute('x2',b.left+b.width/2-bounds.left);line.setAttribute('y2',(top?b.top:b.bottom)-bounds.top);if(i===selected)line.setAttribute('class','active');guides.append(line);button.classList.toggle('active',i===selected)})}
function choose(i){if(game){if(i===goal){found.add(i);buttons[i].classList.add('revealed');if(found.size===24){document.getElementById('gamePrompt').textContent='כל הכבוד! השלמת את כל 24 השמות';return}goal=people.findIndex((_,j)=>!found.has(j))}document.getElementById('gamePrompt').textContent='מצא: '+people[goal][0];return}selected=i;document.getElementById('term').textContent=people[i][0];document.getElementById('description').textContent='בן משפחה מספר '+(i+1)+' מתוך 24';document.getElementById('detail').hidden=false;draw()}
function mode(on){game=on;document.documentElement.classList.toggle('atlas-playing',on);found.clear();buttons.forEach(b=>b.classList.remove('revealed'));selected=-1;goal=0;document.getElementById('gamePrompt').hidden=!on;document.getElementById('gamePrompt').textContent='מצא: '+people[goal][0];document.getElementById('detail').hidden=true;document.getElementById('mode').textContent=on?'📖':'🎮';draw()}
document.getElementById('mode').onclick=()=>mode(!game);if(document.documentElement.classList.contains('atlas-playing'))mode(true);addEventListener('resize',draw);addEventListener('atlas-layout',draw);new ResizeObserver(draw).observe(stage);requestAnimationFrame(draw);
</script><script src="../../js/ask-gpt.js?v=2"></script><script src="../../js/viewport.js?v=11"></script></body></html>
