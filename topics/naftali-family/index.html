<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משפחת דוידוביץ — נפתלי</title><link rel="stylesheet" href="../../css/topic.css?v=9"><link rel="stylesheet" href="../../css/game.css?v=7"><style>body{background:#000;margin:0}main{max-width:1100px;margin:auto;padding:8px}#stage{border:2px solid #e5b72d;border-radius:22px;background:#000;padding:10px;box-sizing:border-box}#family-title{text-align:center;color:#17102d;background:linear-gradient(#ffe78b,#f4b900);border:2px solid #e5b72d;border-radius:18px;font-size:clamp(20px,4vw,40px);font-weight:800;padding:7px;margin:0 0 12px}.family-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;direction:rtl}.family-card{min-width:0;display:flex;flex-direction:column;gap:4px}.portrait{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#eee,#c7c9ce);border:2px solid #efb915;border-radius:13px;overflow:hidden;display:grid;place-items:center}.portrait img{width:100%;height:100%;object-fit:cover}.family-name{background:linear-gradient(#ffe88e,#f5b900);color:#201500;border:1px solid #c98d00;border-radius:11px;min-height:44px;width:100%;font-weight:800;font-size:clamp(10px,1.8vw,19px);overflow-wrap:anywhere;padding:3px;cursor:pointer}.portrait button{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer;color:#5c4a25;font-size:clamp(13px,2vw,25px)}.portrait button:focus-visible,.family-name:focus-visible{outline:3px solid white}.portrait button.has-photo{font-size:0}.portrait button.has-photo:after{content:'✎';font-size:16px;position:absolute;top:2px;right:3px;background:#f6c331;border-radius:6px;padding:0 4px}.family-card input{display:none}#detail{margin-top:8px}#gamePrompt{color:#ffd96c;text-align:center;font-size:20px;margin-bottom:8px}.atlas-playing .family-name:not(.revealed){color:transparent}.atlas-playing .family-name.revealed{color:#201500}@media(max-width:600px){main{padding:3px}#stage{padding:5px;border-radius:15px}.family-grid{gap:4px}.portrait{border-width:1px;border-radius:8px}.family-name{min-height:34px;font-size:clamp(8px,2vw,12px);border-radius:7px;padding:2px 0}#family-title{margin-bottom:6px}}</style><script>if(new URLSearchParams(location.search).get('game')==='1')document.documentElement.classList.add('atlas-playing')</script></head><body>

<main><div id="stage"><h1 id="family-title">משפחת דוידוביץ</h1><div id="gamePrompt" hidden></div><div class="family-grid" id="family-grid"></div></div><section id="detail" hidden><h2 id="term"></h2><p id="description"></p></section></main>
<script>const names=["יצחק דוידוביץ","רות דוידוביץ","נפתלי דוידוביץ","רוחלה דוידוביץ","שרה לרמן","רון דוידוביץ","תמר דוידוביץ","יעל דוידוביץ","שלומית דוידוביץ","עמרי אולוס","שחר הורן","נמרוד הורן","קשת דוידוביץ","לחן דוידוביץ","קורן דוידוביץ","גלי אולוס","דרור לרמן","עדי לרמן","נטע לרמן","טל לביא","ספי לביא","עומר לביא","ליאור לביא",""];const grid=document.getElementById('family-grid');const cards=[],labels=[];let game=false,goal=0,found=new Set();function key(i){return 'visual-family-'+i}function putPhoto(i,src){const portrait=cards[i].querySelector('.portrait');portrait.querySelector('img')?.remove();const img=document.createElement('img');img.src=src;img.alt=names[i];portrait.prepend(img);portrait.querySelector('button').classList.add('has-photo')}names.forEach((name,i)=>{const card=document.createElement('div');card.className='family-card';const portrait=document.createElement('div');portrait.className='portrait';const upload=document.createElement('button');upload.type='button';upload.textContent='＋';upload.title='הוסף תמונה: '+(name||'מקום פנוי');const input=document.createElement('input');input.type='file';input.accept='image/*';upload.onclick=()=>input.click();input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,500/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);const src=canvas.toDataURL('image/jpeg',.75);try{localStorage.setItem(key(i),src)}catch(e){alert('התמונה מוצגת, אך לא ניתן לשמור אותה במכשיר זה')}putPhoto(i,src)};image.src=reader.result};reader.readAsDataURL(file)};portrait.append(upload,input);const label=document.createElement('button');label.type='button';label.className='family-name';label.textContent=name||' ';label.onclick=()=>choose(i);card.append(portrait,label);grid.append(card);cards.push(card);labels.push(label);try{const saved=localStorage.getItem(key(i));if(saved)putPhoto(i,saved)}catch(e){}});function choose(i){if(game){if(i===goal){found.add(i);labels[i].classList.add('revealed');if(found.size===names.filter(Boolean).length){document.getElementById('gamePrompt').textContent='כל הכבוד!';return}goal=names.findIndex((n,j)=>n&&!found.has(j))}document.getElementById('gamePrompt').textContent='מצא: '+names[goal];return}document.getElementById('term').textContent=names[i]||'מקום פנוי';document.getElementById('description').textContent='לחץ על ריבוע התמונה כדי להוסיף תמונת פרופיל';document.getElementById('detail').hidden=false}function mode(on){game=on;document.documentElement.classList.toggle('atlas-playing',on);found.clear();labels.forEach(l=>l.classList.remove('revealed'));goal=0;document.getElementById('gamePrompt').hidden=!on;document.getElementById('gamePrompt').textContent='מצא: '+names[goal];document.getElementById('detail').hidden=true;document.getElementById('mode').textContent=on?'📖':'🎮'}document.getElementById('mode').onclick=()=>mode(!game);if(new URLSearchParams(location.search).get('game')==='1')mode(true);</script><script src="../../js/ask-gpt.js?v=2"></script><script src="../../js/viewport.js?v=11"></script></body></html>
