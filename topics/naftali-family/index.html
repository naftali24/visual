<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>משפחת דוידוביץ — נפתלי</title><style>body{margin:0;background:#0d1118;color:#fff;font:18px system-ui}header{position:sticky;top:0;background:#182333;padding:14px;display:flex;justify-content:space-between}a{color:#b6d9ff}.wrap{max-width:1000px;margin:auto;padding:18px}h1{font-size:1.4rem}h2{font-size:1.2rem;color:#ffd887}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.person{background:#1e2b3c;border:1px solid #536477;border-radius:16px;padding:15px;min-height:105px}.person b{display:block;font-size:1.12rem}.person small{color:#c8d5e4}.avatar{border:2px dashed #7d91aa;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;margin-bottom:10px;color:#b3c3d6}.question{font-size:1.4rem;margin:16px 0}.choices button{padding:12px;margin:5px;background:#30445c;border:1px solid #8295a9;border-radius:10px;color:white;font-size:1rem}.correct{color:#9df2af}.wrong{color:#ffb7b7}</style></head><body><header><a href="../../index.html" target="_top">↻ נושאים</a><span>משפחת דוידוביץ — נפתלי</span><button id="mode">🎮 משחק</button></header><div class="wrap"><h1>משפחת דוידוביץ — נפתלי</h1><p>עץ משפחה ללימוד ולמשחק. התמונות המקוריות יתווספו לאחר העברתן לתיקיית התמונות של האתר. אין תמונות שנוצרו בבינה מלאכותית.</p><div id="learn"></div><div id="game" hidden><div class="question" id="question"></div><div class="choices" id="choices"></div><p id="feedback"></p><button id="next">השאלה הבאה</button></div></div><script>
const groups=[
["משפחת נפתלי", [["נפתלי דוידוביץ","ראש המשפחה"],["רחל דוידוביץ","אשתו, פרודים"],["רון דוידוביץ","בנו של נפתלי"],["תמר דוידוביץ","בתו של נפתלי"],["יעל דוידוביץ","בתו של נפתלי"],["שלומית דוידוביץ","אשתו של רון"],["עמרי אולוס","בעלה של יעל"],["קשת דוידוביץ","בתו של רון"],["לחן דוידוביץ","בתו השנייה של רון"],["קורן דוידוביץ","בנו של רון, אחיה של קשת"],["גלי אולוס","בתם של יעל ועמרי"]]],
["משפחת הורן", [["שחר הורן","בת משפחה"],["נמרוד הורן","נכדו של נפתלי"]]],
["משפחת לרמן ולביא", [["שרה לרמן","אחותו של נפתלי"],["דרור לרמן","בנה של שרה"],["עדי לרמן","אשתו של דרור"],["נטע לרמן","בנם של דרור ועדי"],["טל לביא","בתה של שרה"],["ספי לביא","בעלה של טל — תמונה חסרה"],["עומר לביא","בנה של טל, נכדה של שרה"],["ליאור לביא","בתה של טל, נכדתה של שרה"]]],
["בני משפחה נוספים", [["רוחלה","בת משפחה"],["רות דוידוביץ","אמו של נפתלי"],["יצחק דוידוביץ","אביו של נפתלי"]]]
];
document.getElementById("learn").innerHTML=groups.map(([g,people])=>'<section><h2>'+g+'</h2><div class="grid">'+people.map(([name,relation])=>'<article class="person"><div class="avatar">📷</div><b>'+name+'</b><small>'+relation+'</small></article>').join('')+'</div></section>').join('');
const quiz=[["מי אחותו של נפתלי?","שרה לרמן",["שרה לרמן","עדי לרמן","שלומית דוידוביץ"]],["מי בעלה של טל לביא?","ספי לביא",["דרור לרמן","ספי לביא","עמרי אולוס"]],["מי אשתו של רון?","שלומית דוידוביץ",["שלומית דוידוביץ","עדי לרמן","טל לביא"]],["מי בעלה של יעל?","עמרי אולוס",["ספי לביא","עמרי אולוס","רון דוידוביץ"]],["מי בתו השנייה של רון?","לחן דוידוביץ",["קשת דוידוביץ","גלי אולוס","לחן דוידוביץ"]],["מי בנה של שרה?","דרור לרמן",["רון דוידוביץ","דרור לרמן","קורן דוידוביץ"]]];
let n=0;function show(){const [q,answer,opts]=quiz[n%quiz.length];document.getElementById('question').textContent=q;document.getElementById('feedback').textContent='';document.getElementById('choices').innerHTML='';opts.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{document.getElementById('feedback').textContent=v===answer?'נכון!':'נסה שוב';document.getElementById('feedback').className=v===answer?'correct':'wrong';if(v===answer)document.querySelectorAll('.choices button').forEach(x=>x.disabled=true)};document.getElementById('choices').append(b)})}document.getElementById('mode').onclick=()=>{const game=document.getElementById('game');game.hidden=!game.hidden;document.getElementById('learn').hidden=!game.hidden;show()};document.getElementById('next').onclick=()=>{n++;show()};if(new URLSearchParams(location.search).get('game')==='1')document.getElementById('mode').click();
</script></body></html>
