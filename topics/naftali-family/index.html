<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משפחת דוידוביץ — נפתלי</title><link rel="stylesheet" href="../../css/topic.css?v=9"><link rel="stylesheet" href="../../css/game.css?v=7"><style>
body{background:#090703}main{max-width:1050px;padding:4px}#stage{padding:5px;background:#171109}.family-art{position:relative;width:100%;aspect-ratio:1.72;background:linear-gradient(145deg,#392a14,#17140d);border-radius:8px;overflow:hidden}.family-grid{position:absolute;inset:3% 2%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:1.4%}.tile{position:relative;min-width:0;min-height:0;background:#251e15;border:2px solid #c6a24d;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff8db;cursor:pointer;padding:2px;font:700 clamp(10px,1.55vw,18px)/1.12 system-ui}.tile.active{border-color:#fff0a2;box-shadow:0 0 12px #ffe58c}.tile .portrait{flex:1;min-height:0;width:100%;display:grid;place-items:center;overflow:hidden;color:#b6a47d;font-size:clamp(13px,2vw,26px)}.tile img{width:100%;height:100%;object-fit:cover}.tile .name{font-size:clamp(9px,1.3vw,16px);padding:2px 0}.tile input{display:none}.tile .add{position:absolute;top:2px;left:3px;background:#372d20cc;border-radius:5px;font-size:12px;z-index:3}.tile.correct{opacity:.25}#connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}#connections path{stroke:#ffcf62;stroke-width:3;fill:none;filter:drop-shadow(0 0 3px #000)}#detail{padding:8px;min-height:65px}#detail h2{font-size:20px}#detail p{font-size:16px}#prompt{font-size:21px;color:#ffda68;text-align:center;margin:5px}#gameHint{display:none}.atlas-playing #gameHint{display:block}.atlas-playing #detail{display:none}.atlas-playing .tile .name{visibility:hidden}.atlas-playing .tile.correct .name{visibility:visible}.restart{z-index:30}.mode{right:58px;font-size:22px}.hint{color:#d8c49b;font-size:12px;text-align:center;margin:3px}#photo-editor{display:none} @media(max-width:650px){.family-art{aspect-ratio:1.1}.tile .name{font-size:9px}.family-grid{gap:1%}.tile{border-width:1px}.tile .add{font-size:10px}}

<main><div id="stage"><div id="prompt">משפחת דוידוביץ — נפתלי</div><div class="family-art" id="art"><div class="family-grid" id="grid"></div><svg id="connections"></svg></div><p class="hint" id="gameHint">מצא את בן המשפחה המבוקש</p></div><section id="detail"><h2 id="term">משפחת דוידוביץ</h2><p id="description">לחץ על תמונה להצגת קווי הקרבה. לחץ על ＋ כדי להוסיף צילום אמיתי.</p></section></main>
<script>const people=[["יצחק דוידוביץ",[]],["רות דוידוביץ",[]],["נפתלי דוידוביץ",[0,1]],["רחל דוידוביץ",[]],["שרה לרמן",[0,1]],["רוחלה דוידוביץ",[]],["רון דוידוביץ",[2,3]],["תמר דוידוביץ",[2,3]],["יעל דוידוביץ",[2,3]],["שלומית דוידוביץ",[]],["עמרי אולוס",[]],["שחר הורן",[7]],["נמרוד הורן",[7]],["קשת דוידוביץ",[6,9]],["לחן דוידוביץ",[6,9]],["קורן דוידוביץ",[6,9]],["גלי אולוס",[8,10]],["דרור לרמן",[4]],["עדי לרמן",[]],["נטע לרמן",[17,18]],["טל לביא",[4]],["ספי לביא",[]],["עומר לביא",[20,21]],["ליאור לביא",[20,21]]];const grid=document.getElementById('grid'),art=document.getElementById('art'),svg=document.getElementById('connections'),prompt=document.getElementById('prompt');let selected=-1,game=document.documentElement.classList.contains('atlas-playing'),goal=0,found=new Set();
people.forEach(([name],i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.dataset.i=i;const pic=document.createElement('span');pic.className='portrait';pic.textContent='📷';const nm=document.createElement('span');nm.className='name';nm.textContent=name;const add=document.createElement('span');add.className='add';add.textContent='＋';const inp=document.createElement('input');inp.type='file';inp.accept='image/*';add.onclick=e=>{e.stopPropagation();inp.click()};inp.onchange=()=>{if(!inp.files[0])return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const k=Math.min(1,480/Math.max(img.width,img.height));canvas.width=img.width*k;canvas.height=img.height*k;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const src=canvas.toDataURL('image/jpeg',.72);try{localStorage.setItem('visual-family-'+i,src)}catch{}setPhoto(pic,src)};img.src=reader.result};reader.readAsDataURL(inp.files[0])};b.append(pic,nm,add,inp);b.onclick=()=>choose(i);grid.append(b);const stored=localStorage.getItem('visual-family-'+i);if(stored)setPhoto(pic,stored)});
function setPhoto(el,src){el.replaceChildren();const img=document.createElement('img');img.src=src;el.append(img)}
function choose(i){if(game){if(i===goal){found.add(i);document.querySelectorAll('.tile')[i].classList.add('correct');if(found.size===people.length){prompt.textContent='כל הכבוד! סיימת את המשחק 👏';return}goal=people.findIndex((_,j)=>!found.has(j));prompt.textContent='מצא: '+people[goal][0]}else prompt.textContent='נסה שוב — מצא: '+people[goal][0];return}selected=i;draw();const links=relations(i);document.getElementById('term').textContent=people[i][0];document.getElementById('description').textContent=links.length?'קרובי משפחה: '+links.map(j=>people[j][0]).join(' · '):'עדיין לא הוגדרו קשרים';}
function relations(i){return people.map((p,j)=>j).filter(j=>j!==i&&(people[i][1].includes(j)||people[j][1].includes(i)||people[i][1].some(k=>people[j][1].includes(k))))}
function draw(){svg.replaceChildren();document.querySelectorAll('.tile').forEach((b,i)=>b.classList.toggle('active',i===selected));if(selected<0)return;const base=art.getBoundingClientRect(),tiles=document.querySelectorAll('.tile');function pos(i){const r=tiles[i].getBoundingClientRect();return [(r.left+r.width/2-base.left)/base.width*1000,(r.top+r.height/2-base.top)/base.height*1000]}svg.setAttribute('viewBox','0 0 1000 1000');const a=pos(selected);relations(selected).forEach(i=>{const b=pos(i),p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M'+a[0]+','+a[1]+' Q'+((a[0]+b[0])/2)+','+((a[1]+b[1])/2-70)+' '+b[0]+','+b[1]);svg.append(p)})}
function setGame(on){game=on;document.documentElement.classList.toggle('atlas-playing',game);found.clear();document.querySelectorAll('.tile').forEach(x=>x.classList.remove('correct'));svg.replaceChildren();selected=-1;goal=0;prompt.textContent=game?'מצא: '+people[goal][0]:'משפחת דוידוביץ — נפתלי';document.getElementById('mode').textContent=game?'📖':'🎮'}document.getElementById('mode').onclick=()=>setGame(!game);if(game)setGame(true);addEventListener('resize',draw);addEventListener('atlas-layout',draw);
</script><script src="../../js/ask-gpt.js?v=2"></script><script src="../../js/viewport.js?v=11"></script></body></html>
