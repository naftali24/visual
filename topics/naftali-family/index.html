<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090703}
body{display:flex;flex-direction:column;font-family:Arial,sans-serif}
body>main#family-main{padding-bottom:60px}

.items button{min-height:34px;padding:2px 1px;font-size:clamp(13px,2.3vw,21px);line-height:1.1;background:linear-gradient(#ffe788,#d99a16);color:#241300;border:1px solid #b78b2b;border-radius:5px;overflow-wrap:anywhere}

#family-detail{box-sizing:border-box;position:relative;height:90px;overflow:auto;margin:0;padding:5px 38px;text-align:center;font-size:clamp(15px,2.2vw,19px);font-weight:700;background:#fff7cf;color:#241800;border:1px solid #8b650e;border-radius:8px}

#family-detail p{margin:0;font-size:inherit}

.ask-gpt{left:7px;right:auto}
#page-title{text-align:center;margin:6px 8px 3px;color:#ffda68;font-size:clamp(16px,3vw,24px);flex:none}
@media(max-height:680px){#page-title{margin-top:2px;margin-bottom:1px}.items button{min-height:27px;font-size:clamp(12px,2vw,18px)}}
</style></head><body>

<h1 id="page-title">משפחת דוידוביץ — נפתלי</h1>
<main id="family-main"><div id="stage"><div id="upper-controls"><div class="items" id="above"></div></div><div id="photo-wrap"><img id="picture" src="../../images/davidovitz-family.jpg" alt="24 תמונות בני משפחת דוידוביץ"><svg id="guides" aria-hidden="true"></svg></div>

<script src="../../data/naftali-family/atlasButtons.js"></script><script src="../../data/naftali-family/atlasExplanations.js?v=adi-lerman"></script>
<script>
const originalNames=["נמרוד הורן","רוחלה (רחל) דוידוביץ","תמר דוידוביץ","נפתלי דוידוביץ","יצחק דוידוביץ","רות דוידוביץ","רון דוידוביץ","קשת דוידוביץ","קורן דוידוביץ","יעל דוידוביץ","שרה לרמן","טל לביא","ספי לביא","דרור לרמן","ליאור לביא","עומר לביא","עדי לרמן","נטע לרמן","שחר הורן","חנה בוקשפן","נאווה דוידוביץ","סימי רובין","שרה שוורץ","גלי אולוס"];
const originalRelations=["נכדו של נפתלי, בנה של תמר","אשתו בנפרד של נפתלי","בתו של נפתלי","בעל הפרויקט","אביו של נפתלי","אמו של נפתלי","בנו של נפתלי","נכדתו של נפתלי, בתו של רון","נכדו של נפתלי, בנו של רון","בתו של נפתלי","אחותו של נפתלי","בתה של שרה לרמן","בעלה של טל לביא","בנה של שרה לרמן","בתה של טל לביא","בנה של טל לביא","בת משפחה","בנם של עדי ודרור","נכדתו של נפתלי, בתה של תמר","בת משפחה","בת משפחה","בת משפחה","בת משפחה","נכדתו של נפתלי"];
const records=window.atlasPage.items;
let preference=new URLSearchParams(location.search).get('lang');
if(!preference){try{preference=localStorage.getItem('visualLanguage')}catch{}}
const english=preference==='en';
const pageTitle=window.atlasPage.title;
const title=document.getElementById('page-title');
const term=document.getElementById('term');
const info=document.getElementById('info');
const infoEn=document.getElementById('info-en');
const home=document.querySelector('.restart');
if(english){
  document.documentElement.lang='en';
  document.documentElement.dir='ltr';
  document.title=title.textContent=term.textContent=pageTitle.en;
  info.textContent='Select a name to see the family relationship.';
  document.getElementById('picture').alt='Photos of the Davidovitz family';
  home.title='Back to topics';
}
const names=records.map((it,i)=>(english?it.en:it.he)||it.he||originalNames[i]);
const relations=records.map((it,i)=>window.atlasExplanations[it.id]?.[english?'en':'he']||originalRelations[i]);
const above=document.getElementById('above'),below=document.getElementById('below'),picture=document.getElementById('picture'),guides=document.getElementById('guides');
const items=names.map((name,i)=>({name,relation:relations[i],i,button:null}));
let selected=-1;
let currentSpeech;
const detail=document.getElementById('family-detail');
document.getElementById('close-info').onclick=()=>{detail.hidden=true;};
document.getElementById('read-name').onclick=()=>speakName(records[selected]?.en);
function pick(i){selected=i;speakName(records[i].en);items.forEach((item,j)=>item.button.setAttribute("aria-pressed",String(i===j)));term.textContent=names[i];info.textContent=relations[i];const note=window.atlasExplanations[records[i].id]?.en;infoEn.textContent=note?[records[i].en,note].filter(Boolean).join(' — '):'';infoEn.hidden=english||!note;detail.hidden=false;detail.scrollTop=0;draw();}
function speakName(name){
  if(!name?.trim() || !window.speechSynthesis || typeof window.SpeechSynthesisUtterance!=='function')return;
  const synth=window.speechSynthesis;
  if(synth.speaking || synth.pending)synth.cancel();
  currentSpeech=new window.SpeechSynthesisUtterance(name.trim());
  const voices=synth.getVoices();
  const voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>/^en(?:-|$)/i.test(v.lang));
  if(voice)currentSpeech.voice=voice;
  currentSpeech.lang=voice?.lang||'en-US';
  if(synth.paused)synth.resume();
  synth.speak(currentSpeech);
}
items.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.textContent=item.name;
  if(!english && records[i].en?.trim()){
    const englishName=document.createElement('span');
    englishName.lang='en';
    englishName.dir='ltr';
    englishName.style.display='block';
    englishName.textContent=records[i].en.trim();
    b.append(englishName);
  }
  b.setAttribute('aria-pressed','false');b.setAttribute('data-person-name',item.name);b.onclick=()=>pick(i);item.button=b;(i<12?above:below).append(b)});
function draw(){const frame=guides.getBoundingClientRect(),photo=picture.getBoundingClientRect();if(!frame.width||!frame.height)return;guides.setAttribute('viewBox','0 0 '+frame.width+' '+frame.height);guides.replaceChildren();items.forEach((item,i)=>{const b=item.button.getBoundingClientRect(),col=i%6,row=Math.floor(i/6);const line=document.createElementNS('http://www.w3.org/2000/svg','line');const x=photo.left-frame.left+photo.width*(records[i].x/1000),y=photo.top-frame.top+photo.height*(records[i].y/1000);line.setAttribute('x1',b.left+b.width/2-frame.left);line.setAttribute('y1',i<12?b.bottom-frame.top:b.top-frame.top);line.setAttribute('x2',x);line.setAttribute('y2',y);if(i===selected)line.classList.add('active');if(item.button.classList.contains('solved'))line.classList.add('solved');guides.append(line)})}
picture.addEventListener('load',draw);window.addEventListener('resize',draw);window.addEventListener("atlas-layout",draw);new ResizeObserver(draw).observe(document.getElementById('stage'));draw();
</script><script src="../../js/ask-gpt.js?v=3"></script><script src="../../js/viewport.js?v=12"></script></body></html>
