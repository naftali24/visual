<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משפחת דוידוביץ — נפתלי</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090703;color:#f6e4a4;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.bar{display:flex;gap:10px;align-items:center;padding:6px 10px;flex:none}.bar h1{flex:1;text-align:center;font-size:clamp(16px,2.5vw,25px);margin:0}.bar a,.bar button{border:1px solid #c9a34e;border-radius:7px;background:#18140b;color:#ffe19a;font-size:20px;padding:5px 11px;text-decoration:none;cursor:pointer}.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px}.figure{position:relative;width:min(100%,calc((100dvh - 118px)*1.334));aspect-ratio:1536/1151;max-height:100%;background:#080808}.figure img{width:100%;height:100%;object-fit:contain;display:block}.hit{position:absolute;border:0;background:transparent;cursor:pointer;outline-offset:-4px}.hit.active{outline:4px solid #ffd567}.hit.correct{outline:3px solid #64d28b}.hit.missing{cursor:default}.hit:focus-visible{outline:3px solid white}.leader{position:absolute;left:50%;top:0;height:15%;border-left:2px solid #f2ce67;pointer-events:none}.marker{position:absolute;top:5px;right:5px;background:#1a140b;color:#ffe4a0;border:1px solid #d7b260;padding:2px 5px;border-radius:4px;font-size:clamp(9px,1.4vw,16px);pointer-events:none}.question{font-size:clamp(17px,2.4vw,26px);text-align:center;min-height:32px;color:#fff}.detail{flex:none;min-height:42px;max-height:78px;overflow:auto;text-align:center;font-size:clamp(14px,1.8vw,20px);padding:6px 12px;color:#f8e7ba}.game .marker{display:none}.game .hit{outline:1px solid transparent}.game .hit.correct .marker{display:block}.game .detail{font-weight:bold}.footer{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;padding:3px 8px}.footer button{background:#21190c;border:1px solid #c8a14c;color:#ffe5a2;border-radius:5px;padding:5px 9px;cursor:pointer}.footer button:disabled{opacity:.35}@media(max-height:650px){.bar{padding:2px 8px}.detail{min-height:32px}.footer{padding:1px 5px}}
</style></head><body>
<header class="bar"><a href="../../index.html" target="_top" title="חזרה">↻</a><button id="game" title="משחק">🎮</button><h1>משפחת דוידוביץ — נפתלי</h1><button id="gpt" title="שאל את GPT">GPT</button></header>
<main class="stage"><div class="figure" id="figure"><img src="../../images/davidovitz-family.webp" alt="24 תמונות משפחת דוידוביץ, שש עמודות וארבע שורות"><div id="hits"></div></div></main>
<div class="question" id="question"></div><div class="detail" id="detail">לחצו על תמונה כדי להציג את שמה ואת הקרבה המשפחתית.</div><footer class="footer"><button id="prev">◀</button><span id="count">1 / 24</span><button id="next">▶</button></footer>
<script>
const people=[
{name:"נמרוד הורן",relation:"נכדו של נפתלי, בנה של תמר"},
{name:"רוחלה (רחל) דוידוביץ",relation:"אשתו בנפרד של נפתלי"},
{name:"תמר דוידוביץ",relation:"בתו של נפתלי"},
{name:"נפתלי דוידוביץ",relation:"בעל הפרויקט"},
{name:"יצחק דוידוביץ",relation:"אביו של נפתלי"},
{name:"רות דוידוביץ",relation:"אמו של נפתלי"},
{name:"רון דוידוביץ",relation:"בנו של נפתלי"},
{name:"קשת דוידוביץ",relation:"נכדתו של נפתלי, בתו של רון"},
{name:"קורן דוידוביץ",relation:"נכדו של נפתלי, בנו של רון"},
{name:"יעל דוידוביץ",relation:"בתו של נפתלי"},
{name:"שרה לרמן",relation:"אחותו של נפתלי"},
{name:"טל לביא",relation:"בתה של שרה לרמן"},
{name:"ספי לביא",relation:"בעלה של טל לביא"},
{name:"דרור לרמן",relation:"בנה של שרה לרמן"},
{name:"ליאור לביא",relation:"בתה של טל לביא"},
{name:"עומר לביא",relation:"בנה של טל לביא"},
{name:"עדי לרמן",relation:"בת משפחה"},
{name:"נטע לרמן",relation:"בנם של עדי ודרור"},
{name:"שחר הורן",relation:"נכדתו של נפתלי, בתה של תמר"},
{name:"חנה בוקשפן",relation:"בת משפחה"},
{name:"נאווה דוידוביץ",relation:"בת משפחה"},
{name:"סימי רובין",relation:"בת משפחה"},
{name:"שרה שוורץ",relation:"בת משפחה"},
{name:"גלי אולוס",relation:"נכדתו של נפתלי"}
];
// The photo positions must be verified before attaching identities.
// Empty/unknown photo slots remain unlabeled to avoid false identification.
const positionNames=people.map(p=>p.name); // סדר זמני לעריכה בידי המשתמש
const hits=document.getElementById('hits'),detail=document.getElementById('detail'),question=document.getElementById('question');
let current=0,playing=new URLSearchParams(location.search).get('game')==='1',remaining=[];
const buttons=[];
for(let i=0;i<24;i++){let b=document.createElement('button');b.className='hit';b.style.cssText='left:'+((i%6)*100/6)+'%;top:'+(Math.floor(i/6)*25)+'%;width:'+(100/6)+'%;height:25%';b.setAttribute('aria-label','תמונה '+(i+1));b.onclick=()=>choose(i);hits.append(b);buttons.push(b)}
function draw(){document.body.classList.toggle('game',playing);buttons.forEach((b,i)=>{b.classList.toggle('active',!playing&&current===i);b.classList.toggle('correct',playing&&!remaining.includes(i));b.innerHTML=(!playing||!remaining.includes(i))&&positionNames[i]?'<span class="leader"></span><span class="marker">'+positionNames[i]+'</span>':''});document.getElementById('count').textContent=(current+1)+' / 24';if(playing){question.textContent=remaining.length?'מצאו את: '+(positionNames[remaining[0]]||'בן המשפחה'):'המשחק הסתיים!';detail.textContent='בחרו בתמונה המתאימה'}else{question.textContent='';detail.textContent=positionNames[current]?(people.find(p=>p.name===positionNames[current])?.relation||'בן משפחה'):'תמונה '+(current+1)+' — השיוך טרם אומת'}}function choose(i){if(playing){if(remaining[0]===i){remaining.shift();current=i;draw()}}else{current=i;draw()}}document.getElementById('prev').onclick=()=>{current=(current+23)%24;draw()};document.getElementById('next').onclick=()=>{current=(current+1)%24;draw()};document.getElementById('game').onclick=()=>{playing=!playing;remaining=positionNames.map((n,i)=>n?i:null).filter(i=>i!==null);draw()};document.getElementById('gpt').onclick=()=>{let name=positionNames[current]||'משפחת דוידוביץ';window.open('https://chatgpt.com/?q='+encodeURIComponent('הסבר בעברית על הקרבה המשפחתית של '+name+' למשפחת דוידוביץ. אל תמציא עובדות אישיות.'),'_blank')};draw();
</script></body></html>
