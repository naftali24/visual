<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>משחק תשעת הסרטים</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#fff;font-family:Arial,sans-serif;text-align:center}header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:#1c3049}a,button{background:#304f70;color:white;border:1px solid #a7bed1;border-radius:12px;padding:10px 18px;font-size:20px;cursor:pointer;text-decoration:none}h1{font-size:clamp(20px,4vw,30px);margin:0}main{max-width:min(95vw,76vh,850px);margin:auto}#question{font-size:clamp(22px,4vw,36px);font-weight:bold;min-height:55px;padding:10px}#board{position:relative;width:100%;aspect-ratio:1;background:url('../../images/famous-movies-9-game.svg') center/100% 100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.tile{border:1px solid #ffffff44;background:transparent;color:white;display:flex;align-items:end;justify-content:center;padding:8px;min-width:0;font-size:clamp(13px,2vw,22px);text-shadow:0 2px 4px black}.tile.correct{background:#1c6c4544}.tile span{background:#132338db;border-radius:8px;padding:5px;max-width:95%}.tile:not(.correct) span{display:none}#status{font-size:20px;padding:10px}</style></head><body><header><a href="./index.html">↩ חזרה</a><h1>🎮 9 הסרטים — משחק</h1><button id="reset">↻ איפוס</button></header><main><div id="question"></div><div id="board"></div><div id="status"></div></main><script>const films=["הסנדק","טיטאניק","מלחמת הכוכבים","הקוסם מארץ עוץ","קזבלנקה","פארק היורה","מטריקס","פורסט גאמפ","חלף עם הרוח"];let remaining=[],current=0;const board=document.getElementById('board'),q=document.getElementById('question'),status=document.getElementById('status');function say(s){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='he-IL';speechSynthesis.speak(u)}catch(e){}}function sound(){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=520;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.36)}catch(e){}}function next(){if(!remaining.length){q.textContent='כל הכבוד! זיהית את כל הסרטים!';status.textContent='9 מתוך 9';say('כל הכבוד!');for(let j=0;j<7;j++)setTimeout(sound,j*650);return}current=remaining[Math.floor(Math.random()*remaining.length)];q.textContent='היכן הסרט: '+films[current]+'?';status.textContent=(9-remaining.length)+' מתוך 9'}function reset(){remaining=films.map((_,i)=>i);board.innerHTML='';films.forEach((name,i)=>{let b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','תמונה '+(i+1));b.innerHTML='<span>'+name+'</span>';b.onclick=()=>{if(!remaining.includes(i))return;if(i===current){b.classList.add('correct');remaining=remaining.filter(n=>n!==i);sound();say(name);setTimeout(next,650)}else{b.animate([{background:'#aa222288'},{background:'transparent'}],{duration:500})}};board.appendChild(b)});next()}document.getElementById('reset').onclick=reset;reset();</script></body></html>
