<!doctype html><html lang="he" dir="rtl"><head>
<script src="../../js/fullscreen.js?v=2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>עוד 9 יצירות מופת — הספר הוויזואלי</title><style>
*{box-sizing:border-box}body{margin:0;background:#06152f;color:white;font-family:Arial,sans-serif}.app{max-width:1250px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:8px;gap:8px}header{text-align:center}h1{font-size:clamp(19px,3vw,36px);margin:4px}.top,.bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.part,.action{color:white;background:linear-gradient(#164b87,#08264b);border:2px solid #5aa7f0;border-radius:12px;min-height:42px;padding:5px;font-size:clamp(12px,1.7vw,19px);font-weight:bold;cursor:pointer}.part.active{background:#078c94}.image{position:relative;flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}.image img{width:100%;max-height:56dvh;object-fit:contain;border-radius:9px}.hotspots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);direction:ltr}.hotspots button{border:0;background:transparent;cursor:pointer}.hotspots.game button{background:radial-gradient(circle,rgba(255,40,40,.48) 0 9px,transparent 10px)}.hotspots.game button.done{background:transparent;pointer-events:none}.info{border:1px solid #4275a4;border-radius:10px;background:#102d50;min-height:72px;padding:10px;text-align:center;font-size:clamp(15px,1.8vw,20px);overflow:auto}@media(max-width:650px){.app{gap:5px}.top{grid-template-columns:repeat(3,1fr)}.bottom{grid-template-columns:repeat(3,1fr)}.image img{max-height:47dvh}.part,.action{min-height:37px}}</style></head><body><main class="app"><header><h1 id="title">עוד 9 יצירות מופת — אמנות עולמית</h1></header><div class="top" id="top"></div><div class="image"><img src="../../images/classic-paintings-third-9.jpg" alt="תשע יצירות מופת"><div class="hotspots" id="spots"></div></div><div class="top" id="bottomparts"></div><div class="info" id="info">בחר יצירה כדי לקרוא עליה, או לחץ על משחק.</div><nav class="bottom"><button class="action" id="lang">EN / עברית</button><button class="action" id="reset">↻ איפוס</button><button class="action" id="gpt">GPT</button><button class="action" id="game">🎮 משחק</button><button class="action" id="all">ⓘ הסבר כללי</button></nav></main><script>
const items=[["החמניות","Sunflowers","וינסנט ואן גוך","Vincent van Gogh","1888–1889","סדרת טבע דומם שבה הפרחים מסמלים חיים, קמילה והתחדשות. ואן גוך השתמש בגוונים רבים של צהוב ובמשיכות מכחול בולטות."],["פרגים","Poppy Field","קלוד מונה","Claude Monet","1873","ציור אימפרסיוניסטי של שדה פרגים בארז׳נטיי. כתמי הצבע האדומים ותנועת הדמויות מעבירים תחושת אור ורוח."],["נשיקת יהודה","The Taking of Christ","קאראווג׳ו","Caravaggio","1602","רגע מעצרו של ישו: יהודה מזהה אותו בנשיקה. האור הדרמטי והצפיפות הופכים את הסצנה למתוחה."],["אולימפיה","Olympia","אדואר מאנה","Édouard Manet","1863","דמות אישה המביטה ישירות בצופה. הציור עורר סערה בסלון פריז בשל הישירות וההתייחסות למוסכמות האמנות."],["ארוחת הבוקר על הדשא","Le Déjeuner sur l’herbe","אדואר מאנה","Édouard Manet","1863","מפגש בפיקניק בין דמויות לבושות לאישה עירומה. ההצבה הלא-שגרתית עוררה ביקורת והפכה לסמל המודרניזם."],["דיוקן הזוג ארנולפיני","The Arnolfini Portrait","יאן ואן אייק","Jan van Eyck","1434","דיוקן זוג בחדר עשיר בפרטים. המראה הקמורה מאחור משקפת את החלל ומדגימה את דיוק הציור הפלמי."],["החירות מובילה את העם","Liberty Leading the People","אז׳ן דלקרואה","Eugène Delacroix","1830","דמות החירות מניפה את דגל צרפת מעל בריקדה. היצירה מנציחה את מהפכת יולי ומערבת סמליות עם אירוע היסטורי."],["גן התענוגות הארציים","The Garden of Earthly Delights","הירונימוס בוש","Hieronymus Bosch","בערך 1490–1510","טריפטיכון עמוס דמויות ויצורים דמיוניים, המציע חזון מורכב של גן עדן, תענוגות ועונש. פירושיו שנויים במחלוקת."],["יום ראשון באי לה גרנד ז׳אט","A Sunday Afternoon on the Island of La Grande Jatte","ז׳ורז׳ סרה","Georges Seurat","1884–1886","אנשים מבלים על גדת נהר הסן. סרה בנה את המראה מנקודות צבע זעירות בשיטת הפוינטיליזם."]];let en=false,game=false,target=-1,done=new Set(),selected=-1;const $=id=>document.getElementById(id);function name(i){return items[i][en?1:0]}function render(){document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';$('title').textContent=en?'9 More Masterpieces — World Art':'עוד 9 יצירות מופת — אמנות עולמית';for(const [id,ids] of [['top',[0,1,2,3,4]],['bottomparts',[5,6,7,8]]]){$(id).innerHTML='';ids.forEach(i=>{let b=document.createElement('button');b.className='part'+(selected===i?' active':'');b.textContent=name(i);b.onclick=()=>choose(i);$(id).append(b)})}const s=$('spots');s.innerHTML='';s.className='hotspots'+(game?' game':'');for(let i=0;i<9;i++){let b=document.createElement('button');b.className=done.has(i)?'done':'';b.setAttribute('aria-label',en?'painting position':'מיקום יצירה');b.onclick=()=>tap(i);s.append(b)}if(game){$('info').textContent=(en?'Find: ':'מצא את: ')+name(target)}else if(selected>=0){const a=items[selected];$('info').textContent=en?a[1]+' — '+a[3]+' ('+a[4]+'). '+a[5]:a[0]+' — '+a[2]+' ('+a[4]+'). '+a[5]}else{$('info').textContent=en?'Choose a painting to learn about it.':'בחר יצירה כדי לקרוא עליה, או לחץ על משחק.'}}function choose(i){if(game){target=i;render()}else{selected=i;render()}}function tap(i){if(game){if(i===target){done.add(i);const left=[...Array(9).keys()].filter(n=>!done.has(n));if(left.length){target=left[0]}else{game=false;selected=i;alert(en?'Well done! All nine found!':'כל הכבוד! מצאת את כל תשע היצירות!')}render()}else{$('info').textContent=en?'Try again':'נסה שוב'}}else{selected=i;render()}}$('lang').onclick=()=>{en=!en;render()};$('reset').onclick=()=>{game=false;done.clear();selected=-1;render()};$('game').onclick=()=>{game=!game;done.clear();target=0;selected=-1;render()};$('all').onclick=()=>{game=false;selected=-1;render();$('info').textContent=en?'Nine masterpieces spanning European painting from the 15th to 19th centuries. Tap any painting to learn more.':'תשע יצירות מופת מן המאות ה־15 עד ה־19: רנסנס צפוני, בארוק, רומנטיקה, אימפרסיוניזם ופוסט־אימפרסיוניזם. לחצו על כל ציור להסבר.'};$('gpt').onclick=()=>{const q=selected>=0?name(selected):en?'nine famous masterpieces':'תשע יצירות מופת';window.open('https://chatgpt.com/?q='+encodeURIComponent((en?'Explain in depth: ':'הסבר בהרחבה על ')+q),'_blank')};render();
</script></body></html>
