<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אטלס חזותי</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #090703; color: #fff; font: 16px system-ui, Arial, sans-serif; }
header { background: #120d05; border-bottom: 1px solid #9c7422; padding: 12px; text-align: center; }
h1 { margin: 6px 0; color: #ffda68; font-size: clamp(23px, 4.5vw, 40px); }
header p { color: #9bdcff; margin: 5px 0; font-size: clamp(17px, 3.2vw, 22px); }
main { max-width: 1050px; margin: auto; padding: 10px; }
#stage { position: relative; padding: 6px; border: 1px solid #8b650e; border-radius: 15px; background: #030302; }
#picture { display: block; width: 100%; height: auto; aspect-ratio: 3/2; object-fit: contain; background: #030302; }
.items { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,135px),1fr)); gap: 6px; position: relative; z-index: 1; }
.items button { border: 1px solid #b78b2b; border-radius: 6px; background: #1d1508; color: #9bdcff; font: 700 16px system-ui; padding: 6px 4px; min-height: 48px; cursor: pointer; overflow-wrap: anywhere; }
.items button span { display: block; }
.items button span[lang=he] { color: #f1cf70; }
.items button[aria-pressed=true] { text-shadow: 0 0 7px #edb340; color: #fff4b0; }
.items button:focus-visible { outline: 2px solid #f1cf70; outline-offset: 2px; }
#guides { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#guides line { stroke: #e5845d; stroke-width: 1; opacity: .65; }
#guides line.active { stroke: #ffda68; stroke-width: 3; opacity: 1; }
#detail { text-align: center; margin-top: 10px; padding: 12px; border: 1px solid #8b650e; border-radius: 13px; background: #1e1608; }
h2 { color: #ffd85b; margin: 0 0 8px; font-size: 22px; }
#detail p { margin: 0 0 7px; font-size: 19px; }
#englishInfo { cursor: pointer; border: 0; background: transparent; color: #9bdcff; font: inherit; font-size: 19px; }
[hidden] { display: none !important; }
footer { margin-top: 12px; text-align: center; }
a { color: #9bdcff; }
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="englishTitle" lang="en" dir="ltr"></p></header>
<main>
<div id="stage" dir="ltr">
  <div class="items" id="above"></div>
  <img id="picture" src="./image.webp" width="1536" height="1024" alt="">
  <svg id="guides" aria-hidden="true"></svg>
  <div class="items" id="below"></div>
</div>
<section id="detail" hidden aria-live="polite">
  <h2 id="term"></h2>
  <p id="hebrewInfo"></p>
  <button id="englishInfo" type="button" lang="en" dir="ltr" title="Read aloud"></button>
</section>
<footer><a href="../../index.html">חזרה לאינדקס</a><p>היטל לימודי במבט צד. איברים בעומקים שונים מוצגים יחד.</p><a href="https://vetcenter.purina.pt/sites/default/files/vet_materials/dog_anatomy.pdf">מקור לעיון באנטומיה</a></footer>
</main>
<script src="./buttons.js"></script>
<script src="./explanations.js"></script>
<script>
const get = id => document.getElementById(id);
const page = window.atlasPage;
const notes = window.atlasExplanations;
const stage = get("stage");
const picture = get("picture");
const guides = get("guides");
const buttons = new Map();
let selected = null;
document.title = page.title.en;
get("title").textContent = page.title.he;
get("englishTitle").textContent = page.title.en;
picture.alt = page.title.he;

function speak(text){
  if(!window.speechSynthesis || typeof SpeechSynthesisUtterance !== "function")return;
  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "en-US";
  voice.rate = .9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(voice);
}

function drawLines(){
  const bounds = guides.getBoundingClientRect();
  const image = picture.getBoundingClientRect();
  if(!bounds.width || !bounds.height)return;
  guides.setAttribute("viewBox", [0, 0, bounds.width, bounds.height].join(" "));
  const lines = page.items.map(item=>{
    const {button,top} = buttons.get(item.id);
    const box = button.getBoundingClientRect();
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    const points = {
      x1:box.left + box.width/2 - bounds.left,
      y1:(top?box.bottom:box.top) - bounds.top,
      x2:image.left + image.width*item.x/1000 - bounds.left,
      y2:image.top + image.height*item.y/1000 - bounds.top
    };
    for(const [key,value] of Object.entries(points))line.setAttribute(key,value);
    if(item.id === selected)line.setAttribute("class","active");
    return line;
  });
  guides.replaceChildren(...lines);
}

function select(item){
  selected = item.id;
  const note = notes[item.id];
  get("term").textContent = item.he + " · " + item.en;
  get("hebrewInfo").textContent = note.he;
  get("englishInfo").textContent = note.en;
  get("detail").hidden = false;
  for(const [id,{button}] of buttons)button.setAttribute("aria-pressed",String(id===selected));
  drawLines();
  speak(item.en);
}

const ordered = [...page.items].sort((a,b)=>a.y-b.y);
const half = Math.ceil(ordered.length/2);
for(const [group,top] of [[ordered.slice(0,half),true],[ordered.slice(half),false]]){
  for(const item of group.sort((a,b)=>a.x-b.x)){
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-pressed","false");
    for(const lang of ["en","he"]){
      const text = document.createElement("span");
      text.lang = lang;
      text.dir = lang==="he"?"rtl":"ltr";
      text.textContent = item[lang];
      button.append(text);
    }
    button.addEventListener("click",()=>select(item));
    buttons.set(item.id,{button,top});
    get(top?"above":"below").append(button);
  }
}
get("englishInfo").addEventListener("click",()=>{if(selected)speak(notes[selected].en);});
picture.addEventListener("load",drawLines);
window.addEventListener("resize",drawLines);
if(typeof ResizeObserver==="function")new ResizeObserver(drawLines).observe(stage);
drawLines();
</script>
</body>
</html>
